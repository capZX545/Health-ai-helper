name: android apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: set up android sdk
        uses: android-actions/setup-android@v3

      - name: prepare app assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/www
          # فایل‌های اصلی وب — کل برنامه داخل APK
          cp clinic_2077.html android/app/src/main/assets/www/
          cp manifest.json android/app/src/main/assets/www/ 2>/dev/null || echo "skip manifest"
          cp sw.js android/app/src/main/assets/www/ 2>/dev/null || echo "skip sw"
          cp icon-192.svg android/app/src/main/assets/www/ 2>/dev/null || echo "skip icon"
          cp icon-512.svg android/app/src/main/assets/www/ 2>/dev/null || echo "skip icon"
          # data files
          for f in nlm_conditions.json drugs_fda.json drug_labels.json.gz \
            fa_names.json wiki_diseases.json diseases_doid.json \
            symptoms_hpo.json disease_symptoms_hpo.json.gz \
            diseases_extra.json diseases_offline.db fda_drugs.json; do
            [ -f "$f" ] && cp "$f" android/app/src/main/assets/www/ || echo "skip: $f"
          done
          echo "=== assets ==="
          ls -la android/app/src/main/assets/www/

      - name: download gradle wrapper jar
        shell: bash
        run: |
          cd android
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.1.0/gradle/wrapper/gradle-wrapper.jar"
          ls -la gradle/wrapper/gradle-wrapper.jar

      - name: build apk
        shell: bash
        run: |
          cd android
          export ANDROID_HOME=$HOME/android-sdk
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -40
          if ls app/build/outputs/apk/debug/*.apk 2>/dev/null; then
            echo "APK built successfully"
            cp app/build/outputs/apk/debug/*.apk ../NexusMed-Android.apk
            ls -la ../NexusMed-Android.apk
          else
            echo "::error::APK build failed"
            exit 1
          fi

      - name: publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NexusMed-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
