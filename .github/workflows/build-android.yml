name: android apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: set up java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: install dependencies
        run: |
          pip install buildozer cython==0.29.33
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            autoconf automake libtool pkg-config \
            libffi-dev libssl-dev libjpeg-dev libpng-dev libtool-bin libltdl-dev \
            zlib1g-dev openjdk-17-jdk unzip wget cmake ccache

      - name: copy app files
        shell: bash
        run: |
          cd android
          # همه‌ی فایل‌های پایتون
          for f in ../*.py; do [ -f "$f" ] && cp "$f" .; done
          # داده‌ها
          for f in ../*.json ../*.gz ../*.db ../*.csv ../*.html ../*.js ../*.svg; do
            [ -f "$f" ] && cp "$f" . || true
          done
          # فونت‌ها
          mkdir -p fonts && cp ../fonts/*.ttf fonts/ 2>/dev/null || true
          cp ../.env.example . 2>/dev/null || true
          # icon
          python3 -c "
          import struct, zlib
          def png(w,h,r,g,b):
              def ch(t,d):
                  c=t+d
                  return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
              raw=b''
              for y in range(h):
                  raw+=b'\x00'+bytes([r,g,b])*w
              return b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b'')
          open('icon.png','wb').write(png(512,512,0,240,255))
          "
          echo "=== files ==="
          echo "py: $(ls *.py | wc -l) | data: $(ls *.json *.gz *.db 2>/dev/null | wc -l) | size: $(du -sh . | cut -f1)"

      - name: build apk
        shell: bash
        run: |
          cd android
          # بدون tail تا کل لاگ ببینیم
          buildozer android debug 2>&1 | tee /tmp/build.log || true
          # چک کن APK ساخته شد
          if ls bin/*.apk 2>/dev/null; then
            echo "✅ APK built!"
            ls -la bin/
            cp bin/*.apk ../NexusMed-Android.apk
          else
            echo "::error::APK build failed — checking log..."
            grep -i "error\|fail\|Traceback" /tmp/build.log | tail -20
            exit 1
          fi

      - name: publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NexusMed-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
