<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusMed 2077</title>
<style>
:root{--bg:#04060c;--panel:#0b1220;--panel2:#0e1730;--cy:#00f0ff;--mg:#ff2a6d;--yl:#ffd60a;--gr:#3bff9e;--tx:#d7e3ff;--dim:#6b7fa3;--bd:#16213e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;
background-image:repeating-linear-gradient(0deg,transparent 0 39px,#09122b40 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#09122b40 39px 40px)}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#1c2b52;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
#app{display:grid;grid-template-rows:56px 1fr 26px;grid-template-columns:220px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(180deg,#0c1526,#080f1d);border-bottom:1px solid var(--bd);z-index:5}
.logo{font-size:19px;font-weight:800;letter-spacing:1px;color:var(--cy);text-shadow:0 0 14px #00f0ff88}
.logo b{color:var(--mg);text-shadow:0 0 14px #ff2a6d88}
.pill{display:flex;align-items:center;gap:6px;background:#0d1930;border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--dim);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#555;box-shadow:0 0 8px #000}
.dot.on{background:var(--gr);box-shadow:0 0 10px var(--gr)}.dot.off{background:#f55}.dot.brain{background:var(--cy);box-shadow:0 0 10px var(--cy)}
.hspace{flex:1}
.hbtn{background:#0d1930;border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:7px 13px;font-size:12.5px;transition:.2s}
.hbtn:hover{border-color:var(--cy);color:var(--cy);box-shadow:0 0 12px #00f0ff33}
.hbtn.red{border-color:#5c1430;color:#ff8fab}.hbtn.red:hover{border-color:var(--mg);color:var(--mg)}
nav{background:var(--panel);border-inline-end:1px solid var(--bd);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.nbtn{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:1px solid transparent;color:var(--tx);border-radius:10px;padding:9px 10px;font-size:13px;text-align:start;transition:.15s}
[dir=rtl] .nbtn{text-align:right}
.nbtn:hover{background:#101c36;border-color:var(--bd)}
.nbtn.act{background:linear-gradient(90deg,#0e2036,#0c1526);border-color:#1e4c63;color:var(--cy)}
.nsep{margin:7px 6px 3px;font-size:10.5px;color:var(--dim)}
main{display:grid;grid-template-rows:1fr auto;min-width:0}
#chatwrap{display:flex;flex-direction:column;min-height:0;padding:14px 18px 6px}
#chat{flex:1;overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{max-width:78%;padding:11px 15px;border-radius:14px;line-height:2;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#12233d,#0e1b30);border:1px solid #24406b}
.msg.bot{align-self:flex-start;background:linear-gradient(135deg,#0d1f33,#0b1626);border:1px solid #1e4c63;box-shadow:0 0 18px #00f0ff11}
.msg.emg{border-color:#7a1836;background:linear-gradient(135deg,#2a0d1a,#160810);box-shadow:0 0 22px #ff2a6d33}
.meta{display:block;font-size:10.5px;color:var(--dim);margin-top:7px;direction:ltr;text-align:end}
.b{color:var(--cy);font-weight:700}
#imgprev{display:none;margin:0 18px 6px;gap:10px;align-items:center;font-size:12px;color:var(--dim)}
#imgprev img{height:44px;border-radius:8px;border:1px solid var(--bd)}
#inputbar{display:flex;gap:10px;align-items:flex-end;padding:10px 18px 14px}
#txt{flex:1;background:#0a1424;border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:11px 14px;font-family:inherit;font-size:13.5px;resize:none;height:52px;line-height:1.7;outline:none;transition:.2s}
#txt:focus{border-color:#1e5c73;box-shadow:0 0 14px #00f0ff1e}
.ibtn{background:#0d1930;border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:11px 15px;font-size:15px;transition:.2s}
.ibtn:hover{border-color:var(--cy);color:var(--cy)}
#send{background:linear-gradient(135deg,#00b8d4,#0077b6);border:none;color:#021018;font-weight:800;border-radius:12px;padding:11px 22px;font-size:14px;box-shadow:0 0 16px #00f0ff33}
#send:hover{box-shadow:0 0 24px #00f0ff66}
#send:disabled{opacity:.45;cursor:wait}
footer{grid-column:1/3;text-align:center;font-size:10.5px;color:#41527a;padding:4px;border-top:1px solid var(--bd);background:#070d18}
#panel{position:fixed;top:56px;bottom:26px;inset-inline-end:0;width:min(560px,94vw);background:var(--panel2);border-inline-start:1px solid var(--bd);transform:translateX(0);margin-inline-end:-104%;transition:.28s;z-index:20;display:flex;flex-direction:column;box-shadow:-14px 0 40px #0009}
[dir=rtl] #panel{box-shadow:14px 0 40px #0009}
#panel.open{margin-inline-end:0}
#panel .ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd);font-weight:800;color:var(--cy)}
#panel .pb{flex:1;overflow-y:auto;padding:16px 18px;line-height:2;font-size:13px}
.x{margin-inline-start:auto;background:none;border:none;color:var(--dim);font-size:18px}
.x:hover{color:var(--mg)}
.card{background:#0c1526;border:1px solid var(--bd);border-radius:12px;padding:13px 15px;margin:10px 0}
.card h3{font-size:13.5px;color:var(--cy);margin-bottom:6px}
label.fl{display:block;font-size:11.5px;color:var(--dim);margin:9px 0 3px}
input.f,select.f,textarea.f{width:100%;background:#0a1424;border:1px solid var(--bd);border-radius:9px;color:var(--tx);padding:8px 11px;font-family:inherit;font-size:12.5px;outline:none}
textarea.f{min-height:90px;resize:vertical;line-height:1.9}
.btn{background:#0d1930;border:1px solid var(--bd);border-radius:9px;color:var(--tx);padding:8px 15px;font-size:12.5px;transition:.2s}
.btn:hover{border-color:var(--cy);color:var(--cy)}
.btn.pri{background:linear-gradient(135deg,#00b8d4,#0077b6);border:none;color:#021018;font-weight:700}
.btn.mg{border-color:#5c1430;color:#ff8fab}.btn.mg:hover{border-color:var(--mg);color:var(--mg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ok{color:var(--gr)}.bad{color:#ff8fab}.warn{color:var(--yl)}
.tag{display:inline-block;background:#0e2036;color:var(--cy);border:1px solid #1e4c63;border-radius:14px;padding:2px 10px;font-size:11px;margin:2px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 2px;font-size:12.5px}
.chk input{margin-top:7px;accent-color:#00b8d4}
.q{margin:8px 0;padding:8px 11px;background:#0c1526;border:1px solid var(--bd);border-radius:10px;font-size:12.5px}
.q .opts{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.q .opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.bar{height:13px;background:#101c36;border-radius:7px;overflow:hidden;margin:6px 0;border:1px solid var(--bd)}
.bar i{display:block;height:100%;border-radius:7px}
#cprbtn{width:100%;padding:22px;border-radius:16px;border:2px solid var(--mg);background:#1c0a14;color:var(--mg);font-size:18px;font-weight:800;letter-spacing:2px;transition:.1s}
#cprbtn.pulse{background:var(--mg);color:#fff;box-shadow:0 0 42px #ff2a6daa}
.breath{width:130px;height:130px;border-radius:50%;margin:14px auto;border:2px solid var(--cy);display:flex;align-items:center;justify-content:center;color:var(--cy);font-size:13px;transition:transform 1s;text-align:center}
.steps li{margin:0 18px 4px 0}
[dir=rtl] .steps li{margin:0 18px 4px 18px}
.spin{width:15px;height:15px;border:2px solid #1e4c63;border-top-color:var(--cy);border-radius:50%;display:inline-block;animation:sp 1s linear infinite;vertical-align:-3px;margin:0 7px 0 0}
[dir=rtl] .spin{margin:0 0 0 7px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none}
kbd{background:#101c36;border:1px solid var(--bd);border-radius:5px;padding:1px 7px;font-size:11px;color:var(--cy)}
@media(max-width:860px){#app{grid-template-columns:64px 1fr}.nbtn span.t{display:none}.nsep{display:none}.nbtn{justify-content:center}.msg{max-width:92%}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">NEXUS<b>MED</b> 2077</div>
  <div class="pill"><span class="dot off" id="d-ai"></span><span id="t-ai">external AI</span></div>
  <div class="pill"><span class="dot brain"></span><span id="t-brain">offline brain</span></div>
  <div class="pill"><span id="t-learn">memory: 0</span></div>
  <div class="hspace"></div>
  <button class="hbtn" id="langbtn" onclick="toggleLang()">Farsi</button>
  <button class="hbtn" onclick="doctorMode()" id="docbtn">Doctor Mode</button>
  <button class="hbtn red" onclick="quickEmg()" id="emgbtn">Emergency 115/112</button>
  <button class="hbtn" onclick="openPanel('settings')" id="setbtn">API settings</button>
</header>

<nav id="nav"></nav>

<main>
  <div id="chatwrap">
    <div id="chat"><div class="msg bot" id="hello"></div></div>
  </div>
  <div id="imgprev"><img id="iprevimg" alt=""><span id="iprevtxt"></span><button class="btn" onclick="clearImg()" id="rmimg">remove</button></div>
  <div id="inputbar">
    <button class="ibtn" id="attachbtn" onclick="document.getElementById('imgfile').click()">+</button>
    <input type="file" id="imgfile" accept="image/*" class="hide" onchange="pickImg(this)">
    <textarea id="txt"></textarea>
    <button id="send" onclick="sendMsg()">Send</button>
  </div>
</main>
<footer id="foot"></footer>
</div>

<aside id="panel">
  <div class="ph"><span id="ptitle"></span><button class="x" onclick="closePanel()">x</button></div>
  <div class="pb" id="pbody"></div>
</aside>

var $=function(id){return document.getElementById(id)};

async function api(path,body){
  try{
    var opt=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
    var r=await fetch(path,opt);

  }catch(e){return {ok:false,message_fa:LANG==="fa"?("ارتباط با سرور محلی برقرار نشد: "+e):("Cannot reach the local server: "+e)}}
}

var imgB64=null,imgMime="image/jpeg",busy=false;
function pickImg(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){var s=String(rd.result||"");imgB64=s.split(",")[1];imgMime=f.type||"image/jpeg";
    $("iprevimg").src=s;$("iprevtxt").textContent=f.name;$("imgprev").style.display="flex"};
  rd.readAsDataURL(f);inp.value="";
}
function clearImg(){imgB64=null;$("imgprev").style.display="none"}
$("txt").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg()}});
async function sendMsg(){
  var txt=$("txt").value.trim();
  if(busy)return;
  if(!txt&&!imgB64)return;
  addMsg("user",txt||"[image]");
  $("txt").value="";var note=txt;
  var holder=addMsg("bot","");
  holder.innerHTML='<span class="spin"></span>'+(imgB64?t("imgtyping"):t("typing"));
  busy=true;$("send").disabled=true;
  var hint=imgB64?(window._imgHint||""):"";if(!imgB64)window._imgHint="";
  var res=await api("/api/chat",{text:imgB64?"":txt,image_b64:imgB64,image_mime:imgMime,image_note:note,image_hint:hint});
  busy=false;$("send").disabled=false;
  holder.remove();clearImg();
  var src=res.red_flag?t("src_emg"):(res.source==="internal"?t("src_int"):(res.source==="internal-image"?(LANG==="fa"?"مغز داخلی — تحلیل تصویر":"offline brain - image"):res.source||""));
  if(res.image_type&&res.image_type.label)src+=" | "+res.image_type.label;
  if(res.learned)src+=t("learned");
  addMsg(res.red_flag?"bot emg":"bot",res.text||res.message_fa||"...",src);
  refreshStatus();
}

var brT=null;
function breath(){
  if(brT){clearInterval(brT);brT=null;$("brball").style.transform="";$("brball").textContent=t("ready");$("brbtn").textContent=t("startb");return}
  $("brbtn").textContent=t("stopb");var c=0,ci=0;
  var cyc=[[t("inhale"),4,1.5],[t("hold"),7,1.15],[t("exhale"),8,0.6]];
  var step=function(){var x=cyc[ci];$("brball").textContent=x[0]+" "+fa(x[1]);$("brball").style.transform="scale("+x[2]+")";ci=(ci+1)%3;c++;if(c>12)breath()};
  step();brT=setInterval(step,1000);
  setTimeout(function(){if(brT){clearInterval(brT);brT=null;$("brball").textContent=t("done");$("brbtn").textContent=t("startb")}},93000);
}

var cprT=null,cprA=null;
function cprToggle(){
  if(cprT){clearInterval(cprT);cprT=null;$("cprbtn").classList.remove("pulse");return}
  try{cprA=cprA||new (window.AudioContext||window.webkitAudioContext)()}catch(e){cprA=null}
  var tick=function(){$("cprbtn").classList.add("pulse");
    if(cprA){var o=cprA.createOscillator(),g=cprA.createGain();o.frequency.value=880;o.connect(g);g.connect(cprA.destination);
      g.gain.setValueAtTime(.25,cprA.currentTime);g.gain.exponentialRampToValueAtTime(.001,cprA.currentTime+.12);o.start();o.stop(cprA.currentTime+.13)}
    setTimeout(function(){$("cprbtn").classList.remove("pulse")},240)};
  tick();cprT=setInterval(tick,545);
}

async function runAssess(){
  var r=await api("/api/assess",{text:$("asstxt").value});
  var el=$("assres");
  if(!r.ok){el.innerHTML='<p class="warn">'+esc(r.message_fa)+"</p>";return}
  if(r.red_flag){el.innerHTML='<div class="card" style="border-color:#7a1836">'+fmt(r.text)+"</div>";return}
  var U=t("assess_urg");
  var h="";
  if(r.triage){
    var tc=r.triage.level==="emergency"?"#ff2a6d":(r.triage.level==="urgent"?"#ffb020":"#3bff9e");
    h='<div class="card" style="border-color:'+tc+'"><b style="color:'+tc+'">'+t("assess_triage")+': '+esc(U[r.triage.level]||r.triage.level)+'</b><br><small>'+esc(r.triage.where)+"</small></div>";
  }
  h+='<div class="card"><b>'+t("assess_symptoms")+':</b> '+((r.symptoms||[]).map(function(s){return '<span class="tag">'+esc(s)+"</span>"}).join("")||"—");
  if((r.denied||[]).length)h+='<br><small style="color:var(--dim)">'+t("assess_denied")+": "+r.denied.map(esc).join("، ")+"</small>";
  if(r.duration_days)h+='<br><small>'+t("assess_dur")+": "+fa(r.duration_days)+"</small>";
  h+="</div>";
  if((r.candidates||[]).length){
    h+='<div class="card"><h3>'+t("assess_cands")+'</h3>'+r.candidates.map(function(c){
      var color=c.urgency==="emergency"?"#ff2a6d":(c.urgency==="urgent"?"#ffb020":"#3bff9e");
      return '<div class="q"><b>'+esc(c.name)+'</b> <b style="color:'+color+'">'+fa(c.percent)+(LANG==="fa"?"٪":"%")+'</b>'+
      ' <small style="color:'+color+'">'+esc(U[c.urgency]||c.urgency)+"</small>"+
      '<div class="bar"><i style="width:'+Math.min(100,c.percent)+'%;background:'+color+'"></i></div>'+
      '<small style="color:var(--dim)">'+t("assess_matched")+": "+esc((c.matched_symptoms||[]).join("، "))+"</small><br>"+
      (c.advice||[]).map(function(a){return "<small>• "+esc(a)+"</small><br>"}).join("")+
      (c.doctor_when?"<small class='warn'>"+esc(c.doctor_when)+"</small>":"")+"</div>"}).join("")+"</div>";
  } else {
    h+='<div class="card"><p class="warn">'+t("assess_none")+"</p></div>";
  }
  if(r.ml&&r.ml.length){
    h+='<div class="card"><small>'+t("assess_ml")+": "+r.ml.map(function(m){return esc(m.label)+" (~"+fa(m.percent)+(LANG==="fa"?"٪":"%")+")"}).join("، ")+"</small></div>";
  }
  if((r.rag||[]).length){
    h+='<div class="card"><small>'+t("assess_rag")+": "+r.rag.map(esc).join("، ")+"</small></div>";
  }
  el.innerHTML=h;
}

document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(e.ctrlKey&&!e.altKey&&!e.metaKey){
    if(k==="enter"){e.preventDefault();sendMsg();return}
    if(k==="n"){e.preventDefault();newConversation();return}
    if(k===","){e.preventDefault();openPanel("settings");return}
    if(k==="e"){e.preventDefault();quickEmg();return}
    if(k==="/"){e.preventDefault();showShortcuts();return}
  }
  if(e.key==="Escape"){closePanel()}
  if(e.key==="F1"){e.preventDefault();showShortcuts()}
});
function showShortcuts(){
  var items=[["Ctrl+Enter",t("kb_send")],["Ctrl+N",t("kb_new")],["Ctrl+,",t("kb_settings")],["Ctrl+E",t("kb_emg")],["Ctrl+/",t("kb_help")],["Esc","Close panel"],["F1",t("kb_help")]];

  $("panel").classList.add("open");$("ptitle").textContent=t("kb_title");
}
